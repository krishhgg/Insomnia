name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing in this workflow writes to the repo, checks, or packages.
permissions:
  contents: read

# One run per ref; a newer push cancels the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift test and release build (macOS 26)
    # macos-26 (arm64) hosted image: Xcode 26.6 is the image default; 26.4.1 is
    # also installed. The image default is used as-is (no xcode-select).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Print toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install tmux
        # The hosted macOS image has no tmux, so the tmux integration tests skip.
        # Homebrew is preinstalled; on arm64 it links into /opt/homebrew/bin,
        # which is a path TmuxNudge probes. Unprivileged, runner-only install.
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          if ! brew list --versions tmux >/dev/null 2>&1; then
            brew install tmux
          fi
          tmux_bin="$(brew --prefix)/bin/tmux"
          case "$tmux_bin" in
            /opt/homebrew/bin/tmux|/usr/local/bin/tmux) ;;
            *)
              echo "tmux linked at unexpected path: $tmux_bin" >&2
              exit 1
              ;;
          esac
          test -x "$tmux_bin"
          echo "tmux: $tmux_bin"
          "$tmux_bin" -V

      - name: Run tests
        run: swift test

      - name: Build release
        run: swift build -c release

      - name: Check the lid simulation is compiled out of the release binary
        # Looks at the binaries, not the compilation condition: the plain
        # release build above must lack the simulate-lid.sh watcher, and a
        # build with -DINSOMNIA_LID_SIMULATION (what install.sh adds for
        # INSOMNIA_LID_SIMULATION=1) must have it.
        run: scripts/check-lid-simulation-gate.sh

  shellcheck:
    name: ShellCheck scripts
    # shellcheck ships preinstalled on ubuntu-24.04; the macOS image has none.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint shell scripts
        run: |
          shellcheck --version
          shellcheck scripts/*.sh
